name: Compile and test EzraBot

on:
  push:
    branches: [main, feat/mimobot-react-three]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install React dependencies
        run: npm ci
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Check TypeScript
        run: npm run typecheck
      - name: Verify mobile protocol
        run: node server/mobile/scripts/sync-contract.mjs --check
      - name: Build production bundles
        run: npm run build
      - name: Test server with controlled engines
        run: node --test --test-concurrency=1 'server/dist/test/*.test.js'
      - name: Install browser for interface tests
        run: npx playwright install --with-deps chromium
      - name: Test interface without provider calls
        run: npx playwright test
      - name: Keep interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
